{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CivicConnect - Smart Civic Reporting Platform{% endblock %}</title>

  <!-- Google Fonts: Inter / Geist style -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tailwind CSS CDN for exact 1-to-1 fidelity with original React Tailwind styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            geist: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          },
          animation: {
            'grid': 'grid 15s linear infinite',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            grid: {
              '0%': { transform: 'translateY(-50%)' },
              '100%': { transform: 'translateY(0)' },
            },
          },
        },
      },
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom CSS for RetroGrid and 3D Card Flip -->
  <style>
    /* RetroGrid styling matching React component */
    .retro-grid-container {
      --grid-angle: 65deg;
      --cell-size: 50px;
      --opacity: 0.4;
      --light-line: #4a4a4a;
      --dark-line: #2a2a2a;
      pointer-events: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      perspective: 200px;
      opacity: var(--opacity);
    }

    .retro-grid-inner {
      position: absolute;
      inset: 0;
      transform: rotateX(var(--grid-angle));
    }

    .retro-grid-lines {
      height: 300vh;
      inset: 0% 0px;
      margin-left: -200%;
      transform-origin: 100% 0 0;
      width: 600vw;
      background-repeat: repeat;
      background-size: var(--cell-size) var(--cell-size);
      background-image: linear-gradient(to right, var(--light-line) 1px, transparent 0),
        linear-gradient(to bottom, var(--light-line) 1px, transparent 0);
      animation: retroGridMove 20s linear infinite;
    }

    @keyframes retroGridMove {
      0% {
        transform: translateY(-50%);
      }

      100% {
        transform: translateY(0);
      }
    }

    /* 3D Flip Card Flip mechanism */
    .perspective-container {
      perspective: 2000px;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 1s ease-in-out;
    }

    .flip-card-inner.flipped {
      transform: rotateY(180deg);
    }

    .flip-card-front,
    .flip-card-back {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    .flip-card-back {
      transform: rotateY(180deg);
    }

    /* Scrollbar hide utility */
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>

<body class="bg-slate-950 text-slate-800 antialiased font-sans">
  {% block content %}{% endblock %}

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Lucide Icon initialization -->
  <script>
    lucide.createIcons();
  </script>

  {% block extra_js %}{% endblock %}
</body>

</html>
